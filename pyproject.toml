[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catena-eo"
version = "0.0.1"
description = "Cloud masking conditioned on the imaging chain, for any sensor and any processor"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Parampuneet Kaur Thind" }]
# Dependencies grow with the build: torch arrives with the model, PyNAS with the search.
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]
data = ["requests>=2.31", "tqdm>=4.66", "huggingface_hub>=0.24", "rasterio>=1.4", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"catena.sensors" = ["specs/*.yaml"]
"catena.data" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
